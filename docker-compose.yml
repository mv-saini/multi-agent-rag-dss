services:
  postgres:
    image: paradedb/paradedb:0.26.6-pg17
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_search,pg_cron,pg_stat_statements
      - -c
      - cron.database_name=postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dss
      POSTGRES_USER: dss
      POSTGRES_PASSWORD: dss
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - type: bind
        source: ./data/db.sql
        target: /docker-entrypoint-initdb.d/00-db.sql
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
          && psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc
          "SELECT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = 'fk_userid_conversations') AND to_regclass('public.parent_chunks') IS NOT NULL AND to_regclass('public.child_chunks') IS NOT NULL AND to_regclass('public.child_chunks_bm25_idx') IS NOT NULL"
          | grep -qx t
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      POSTGRES_DSN: postgresql://dss:dss@postgres:5432/dss
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
